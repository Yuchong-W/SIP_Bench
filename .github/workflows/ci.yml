name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run CI checks and credential-free native suite lane
        run: |
          mkdir -p ci-artifacts
          python scripts/run_release_checks.py \
            --plan-matrix \
            --report ci-artifacts/release-report.json
      - name: Upload native suite report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sip-bench-native-suite-report
          path: ci-artifacts/
          if-no-files-found: error
